
name: Build RealmForgeAlpha

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="RealmForgeAlpha-JJK-Skill-Port-Fixed-Particle-API.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Missing $ZIP_FILE in repository root."
            echo "Upload the project ZIP to your repository root."
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          WRAPPER="$(find extracted -type f -name gradlew -print -quit)"

          if [ -n "$WRAPPER" ]; then
            PROJECT_DIR="$(dirname "$WRAPPER")"
          else
            BUILD_FILE="$(find extracted -type f \( -name build.gradle -o -name build.gradle.kts \) -not -path '*/build/*' -print -quit)"

            if [ -z "$BUILD_FILE" ]; then
              echo "::error::No Gradle project found in the ZIP."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$BUILD_FILE")"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Fabric mod
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon clean build
          else
            echo "::error::The project has no Gradle wrapper (gradlew)."
            exit 1
          fi

      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: RealmForgeAlpha-Fabric-1.21.1
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error

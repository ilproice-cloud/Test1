
name: Build RealmForge Fabric 1.21.1

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract project ZIP if needed
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f build.gradle ] && [ ! -f settings.gradle ]; then
            ZIP_FILE="$(find . -maxdepth 2 -type f \( -iname 'realmforgeUpd2.zip' -o -iname 'realmforge.zip' \) -print -quit || true)"

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No Gradle project or RealmForge ZIP found."
              exit 1
            fi

            mkdir -p extracted
            unzip -oq "$ZIP_FILE" -d extracted
          fi

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          BUILD_FILE="$(find . -type f -name build.gradle -not -path '*/.gradle/*' -print -quit || true)"

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found."
            find . -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Building: $PROJECT_DIR"

      - name: Build mod
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.dir }}"
          gradle clean build --no-daemon

      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: RealmForge-Fabric-1.21.1
          path: '${{ steps.project.outputs.dir }}/build/libs/*.jar'
          if-no-files-found: error

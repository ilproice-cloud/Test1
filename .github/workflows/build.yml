
name: Build RealmForge

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract RealmForge ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -type f -iname 'realmforgeUpd2.zip' -print -quit || true)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: realmforgeUpd2.zip was not found in the repository."
            echo "Repository files:"
            find . -maxdepth 3 -type f | head -200
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          GRADLEW="$(find . -type f -name gradlew \
            -not -path '*/.gradle/*' -print -quit || true)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: No gradlew found in the repository or extracted ZIP."
            find . -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project: $PROJECT_DIR"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build RealmForge
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.dir }}"
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RealmForge-Fabric-1.21.1
          path: '**/build/libs/*.jar'
          if-no-files-found: error

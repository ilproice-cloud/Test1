
name: Build RealmForgeAlpha

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract source
        run: |
          set -euo pipefail
          unzip -oq RealmForgeAlpha-Text-Buttons-Icon-Fix.zip -d extracted

      - name: Find project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(find extracted -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -not -path '*/build/*' \
            -print -quit)"
          test -n "$FILE" || {
            echo "No Gradle build file found"
            exit 1
          }
          echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"

      - name: Build mod
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.dir }}"
          gradle clean build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: RealmForgeAlpha
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error


name: Build RealmForgeAlpha

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract updated source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="RealmForgeAlpha-Updated-Source.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found in repository root."
            exit 1
          fi

          rm -rf realmforge_alpha
          mkdir -p realmforge_alpha
          unzip -oq "$ZIP_FILE" -d realmforge_alpha

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          BUILD_FILE="$(find realmforge_alpha \
            -type f -name build.gradle \
            -not -path '*/.gradle/*' -print -quit)"

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build mod
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.dir }}"
          gradle clean build --no-daemon

      - name: Upload RealmForgeAlpha JAR
        uses: actions/upload-artifact@v4
        with:
          name: RealmForgeAlpha
          path: realmforge_alpha/**/build/libs/*.jar
          if-no-files-found: error

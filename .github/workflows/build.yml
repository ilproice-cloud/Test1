name: Build RealmForge Fabric 1.21.1

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract RealmForge ZIP if present
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 2 -type f \( -iname 'realmforgeUpd2.zip' -o -iname 'realmforge.zip' \) -print -quit || true)"

          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting $ZIP_FILE"
            mkdir -p extracted
            unzip -oq "$ZIP_FILE" -d extracted
          fi

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          BUILD_FILE="$(find . -type f -name build.gradle -not -path '*/.gradle/*' -print -quit || true)"

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: No build.gradle found."
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Using project: $PROJECT_DIR"

          test -f "$PROJECT_DIR/settings.gradle"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle 8.8
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --location --retry 3 \
            https://services.gradle.org/distributions/gradle-8.8-bin.zip \
            --output "$RUNNER_TEMP/gradle-8.8-bin.zip"

          unzip -q "$RUNNER_TEMP/gradle-8.8-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.8/bin" >> "$GITHUB_PATH"

      - name: Build RealmForge
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.dir }}"
          gradle clean build --no-daemon

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RealmForge-Fabric-1.21.1
          path: '${{ steps.project.outputs.dir }}/build/libs/*.jar'
          if-no-files-found: error

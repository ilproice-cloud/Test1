
name: Build RealmForgeAlpha JJK Combo Update

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract combo update
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="RealmForgeAlpha-JJK-Combo-Update.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Missing $ZIP_FILE in repository root."
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted

      - name: Find Gradle project
        shell: bash
        run: |
          set -euo pipefail

          BUILD_FILE=$(find extracted -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -not -path '*/build/*' \
            -not -path '*/.gradle/*' \
            -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            echo "::error::No Gradle build file found in the ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$BUILD_FILE")" >> "$GITHUB_ENV"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build mod
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon clean build

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: RealmForgeAlpha-JJK-Combo-Update
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error

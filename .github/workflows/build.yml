name: Build RealmForgeAlpha

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Find project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          BUILD_FILE="$(find . \
            -type f -name build.gradle \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            -print -quit)"

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found."
            echo "Upload the extracted mod source, not just the workflow."
            exit 1
          fi

          echo "dir=$(dirname "$BUILD_FILE")" >> "$GITHUB_OUTPUT"

      - name: Build mod
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.dir }}"
          gradle clean build --no-daemon

      - name: Upload RealmForgeAlpha JAR
        uses: actions/upload-artifact@v4
        with:
          name: RealmForgeAlpha
          path: |
            **/build/libs/*.jar
          if-no-files-found: error


name: Build RealmForge Fabric 1.21.1

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract latest RealmForge source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="RealmForge-Book-Navigation-Fix-2.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found in repository root."
            exit 1
          fi

          rm -rf realmforge_latest
          mkdir -p realmforge_latest
          unzip -oq "$ZIP_FILE" -d realmforge_latest

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          BUILD_FILE="$(find realmforge_latest -type f \
            -name build.gradle \
            -not -path '*/.gradle/*' \
            -print -quit)"

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found in the extracted ZIP."
            find realmforge_latest -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project: $PROJECT_DIR"

      - name: Build RealmForge
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.dir }}"
          gradle clean build --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: RealmForge-Fabric-1.21.1
          path: '${{ steps.project.outputs.dir }}/build/libs/*.jar'
          if-no-files-found: error

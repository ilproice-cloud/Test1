name: Build RealmForgeAlpha

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Locate and build mod
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository contents:"
          ls -la

          BUILD_FILE="$(find . -maxdepth 8 \
            \( -name .git -o -name .gradle -o -name build \) -prune \
            -o -type f \( -name build.gradle -o -name build.gradle.kts \) \
            -print -quit)"

          if [ -z "$BUILD_FILE" ]; then
            echo "::error::No Gradle build file found. The repository must contain the mod source project."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          echo "Project directory: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          gradle --no-daemon clean build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: RealmForgeAlpha-Fabric-1.21.1
          path: '**/build/libs/*.jar'
          if-no-files-found: error

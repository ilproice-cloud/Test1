name: Build RealmForgeAlpha Healing Magic Stats Fix

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract source
        run: |
          set -euo pipefail
          ZIP_FILE="RealmForgeAlpha-Healing-Magic-Stats-Fix.zip"
          test -f "$ZIP_FILE" || {
            echo "ERROR: Source ZIP missing from repository root."
            exit 1
          }
          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(find extracted -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -not -path '*/build/*' \
            -not -path '*/.gradle/*' \
            -print -quit)"
          if [ -z "$FILE" ]; then
            echo "ERROR: Gradle build file not found."
            exit 1
          fi
          echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"

      - name: Build Fabric mod
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.dir }}"
          gradle clean build --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: RealmForgeAlpha
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error


name: Build RealmForge

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Extract RealmForge ZIP if present
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -type f -iname 'realmforgeUpd2.zip' -print -quit)"

          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP: $ZIP_FILE"
            mkdir -p extracted
            unzip -oq "$ZIP_FILE" -d extracted
          else
            echo "No realmforgeUpd2.zip found; checking repository files."
          fi

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          GRADLEW="$(find . -type f -name gradlew \
            -not -path '*/.gradle/*' \
            -print -quit || true)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: No gradlew found."
            echo "Make sure the ZIP contains the Gradle project."
            find . -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $PROJECT_DIR"

      - name: Build mod
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.dir }}"
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RealmForge-Fabric-1.21.1
          path: '**/build/libs/*.jar'
          if-no-files-found: error

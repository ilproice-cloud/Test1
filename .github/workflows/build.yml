
name: Build RealmForgeAlpha

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract source
        run: |
          set -euo pipefail
          test -f RealmForgeAlpha-Fixed-Book-UI.zip
          mkdir -p extracted
          unzip -oq RealmForgeAlpha-Fixed-Book-UI.zip -d extracted

      - name: Find mod project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          BUILD_FILE="$(find extracted -type f \( -name build.gradle -o -name build.gradle.kts \) -not -path '*/build/*' -print -quit)"
          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: Gradle build file missing from source ZIP."
            exit 1
          fi
          echo "dir=$(dirname "$BUILD_FILE")" >> "$GITHUB_OUTPUT"

      - name: Build mod
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.dir }}"
          gradle clean build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: RealmForgeAlpha
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error

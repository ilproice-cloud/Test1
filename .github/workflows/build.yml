name: Build RealmForge Fabric 1.21.1

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract RealmForge ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -type f \
            -name 'RealmForge-Book-Navigation-Fix.zip' \
            -not -path './.git/*' \
            -not -path './extracted/*' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: RealmForge-Book-Navigation-Fix.zip not found."
            echo "Upload the ZIP to the root of your repository."
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          BUILD_FILE="$(find extracted -type f \
            -name build.gradle \
            -not -path '*/.gradle/*' \
            -print -quit)"

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: No build.gradle found inside the ZIP."
            find extracted -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Building project at: $PROJECT_DIR"

      - name: Build RealmForge
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.dir }}"
          gradle clean build --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: RealmForge-Fabric-1.21.1
          path: '${{ steps.project.outputs.dir }}/build/libs/*.jar'
          if-no-files-found: error

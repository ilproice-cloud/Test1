
name: Build RealmForge Fabric 1.21.1

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract RealmForge ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -type f -iname 'realmforgeUpd2.zip' \
            -not -path './extracted/*' -print -quit || true)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: realmforgeUpd2.zip was not found."
            find . -maxdepth 3 -type f | head -200
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted
          echo "Extracted: $ZIP_FILE"

      - name: Find project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          BUILD_FILE="$(find extracted -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -not -path '*/build/*' -print -quit)"

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: No build.gradle found in the ZIP."
            find extracted -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build RealmForge
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.dir }}"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew clean build --no-daemon
          else
            echo "Gradle wrapper missing; using installed Gradle."
            gradle clean build --no-daemon
          fi

      - name: Show generated JARs
        if: success()
        shell: bash
        run: |
          find extracted -type f -path '*/build/libs/*.jar' \
            ! -name '*-sources.jar' -print

      - name: Upload playable mod
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RealmForge-Fabric-1.21.1
          path: |
            extracted/**/build/libs/*.jar
            !extracted/**/*-sources.jar
          if-no-files-found: error

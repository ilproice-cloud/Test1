
name: Build RealmForgeAlpha JJK Skill Port

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract JJK skill port source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="RealmForgeAlpha-JJK-Skill-Port.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Upload $ZIP to the repository root."
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP" -d extracted

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          FILE=$(find extracted \
            -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -not -path '*/build/*' \
            -not -path '*/.gradle/*' \
            -print -quit)

          if [ -z "$FILE" ]; then
            echo "ERROR: No Gradle build file found."
            exit 1
          fi

          echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"

      - name: Build mod
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.dir }}"
          gradle clean build --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: RealmForgeAlpha-JJK-Skill-Port
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
